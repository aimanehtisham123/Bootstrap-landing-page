<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap 5 Header with Logo (Always Toggle)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<!-- Header Start -->
<nav class="navbar navbar-light bg-light shadow-sm navbar-expand-lg">
  <div class="container">
    <!-- Logo with Image -->
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="assets/SiteLogo.png" alt="Logo" class="me-2 img-fluid" style="max-height: 40px;">
    </a>

    <!-- Toggle button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Contact</a>
        </li>
      </ul>

      <!-- Search Button -->
      <form class="d-flex ms-lg-3 mt-3 mt-lg-0">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
<!-- Header End -->

<!-- main content -->
<main class="container mt-5 pt-5 pb-5">
  <div class="row align-items-center">
    
    <!-- Left content -->
    <div class="col-md-6 text-center text-md-start mb-4 mb-md-0">
      <h1 class="fw-bold mb-3 display-5">
        STREAMLINE YOUR<br> ENTIRE PRODUCT <br>DESIGN WORKFLOW
      </h1>
      <p class="mb-4 lead">
        Connect designers, product managers and front-end developers — optimization at its best
      </p>

      <!-- Store icons -->
      <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-3 mb-4">
        <img src="assets/store.png" alt="Store" class="img-fluid" style="max-height: 50px;">
        <img src="assets/store.png" alt="Store" class="img-fluid" style="max-height: 50px;">
        <img src="assets/store.png" alt="Store" class="img-fluid" style="max-height: 50px;">
      </div>
    </div>

    <!-- Right image with button below -->
    <div class="col-md-6 text-center">
      <img src="assets/Abstraction.png" alt="Abstraction" class="img-fluid mb-3" style="max-height: 300px;">
      <br>
      <button class="btn btn-info px-5 py-2 rounded-pill text-white">
        Get Started
      </button>
    </div>

  </div>
</main>
</body>
</html>
